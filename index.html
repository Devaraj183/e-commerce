<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZENO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap');

  :root{
    --cream:#FFF6EC;
    --coral:#FF6B5B;
    --coral-dark:#E9503F;
    --mint:#3FBFAD;
    --navy:#2B2A4C;
    --sun:#FFC24B;
    --pink:#FF9EC0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at 50% -10%, #FFEBD9 0%, var(--cream) 55%, #FFEFDC 100%);
    font-family:'Inter', sans-serif;
    color:var(--navy);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  .sparkle{
    position:absolute;
    font-size:18px;
    opacity:0.8;
    animation: floatUp linear infinite;
    pointer-events:none;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    10%{opacity:0.9;}
    90%{opacity:0.6;}
    100%{ transform:translateY(-110vh) rotate(360deg); opacity:0; }
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:28px 48px;
    position:relative;
    z-index:5;
  }
  .logo{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:24px;
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .logo-badge{
    background:var(--coral);
    color:white;
    width:34px;height:34px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    transform:rotate(-8deg);
    box-shadow:3px 3px 0 var(--navy);
  }
  .status-pill{
    background:white;
    border:2px solid var(--navy);
    border-radius:999px;
    padding:6px 14px;
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--mint);
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);opacity:1;}
    50%{transform:scale(1.6);opacity:0.5;}
  }

  .hero{
    text-align:center;
    padding:20px 20px 0;
    position:relative;
    z-index:5;
  }
  .eyebrow{
    font-weight:700;
    color:var(--coral-dark);
    letter-spacing:2px;
    font-size:13px;
    text-transform:uppercase;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(34px, 6vw, 68px);
    line-height:1.05;
    margin:14px auto 10px;
    max-width:820px;
  }
  h1 .accent{ color:var(--coral); }
  .sub{
    font-size:17px;
    color:#5c5a7a;
    max-width:480px;
    margin:0 auto 30px;
    line-height:1.55;
  }

  .progress-wrap{ max-width:380px; margin:0 auto 6px; }
  .progress-track{
    background:white;
    border:2px solid var(--navy);
    border-radius:999px;
    height:20px;
    overflow:hidden;
    position:relative;
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:repeating-linear-gradient(45deg, var(--coral), var(--coral) 10px, var(--coral-dark) 10px, var(--coral-dark) 20px);
    background-size:200% 100%;
    animation: fillUp 3.2s ease-out forwards, stripes 1.2s linear infinite;
  }
  @keyframes fillUp{ 0%{width:0%;} 100%{width:78%;} }
  @keyframes stripes{ 0%{background-position:0 0;} 100%{background-position:40px 0;} }
  .progress-label{ font-size:12px; font-weight:600; color:#8b88a8; margin-top:8px; letter-spacing:0.3px; }

 
  .fine{ font-size:12px; color:#9a97b5; margin-bottom:10px; }

  .scene{ position:relative; height:340px; margin-top:10px; overflow:hidden; }
  .ground{ position:absolute; bottom:0; left:0; right:0; height:90px; background:var(--mint); border-top:3px solid var(--navy); }
  .ground::before{
    content:"";
    position:absolute; top:-3px; left:0; right:0; height:3px;
    background:repeating-linear-gradient(90deg, var(--navy) 0 20px, transparent 20px 40px);
  }

  .belt{ position:absolute; bottom:88px; left:8%; right:8%; height:14px; background:var(--navy); border-radius:6px; }
  .belt::after{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(90deg, #ffffff33 0 10px, transparent 10px 26px);
    animation:beltMove 0.7s linear infinite;
  }
  @keyframes beltMove{ from{background-position:0 0;} to{background-position:-26px 0;} }

  .box{
    position:absolute; bottom:100px; width:46px; height:40px;
    background:var(--sun); border:3px solid var(--navy); border-radius:6px;
    animation:conveyor 6s linear infinite;
  }
  .box::before{ content:""; position:absolute; left:50%; top:0; bottom:0; width:8px; margin-left:-4px; background:#e8a93a; border-left:2px solid var(--navy); border-right:2px solid var(--navy); }
  .box::after{ content:""; position:absolute; top:50%; left:0; right:0; height:8px; margin-top:-4px; background:#e8a93a; border-top:2px solid var(--navy); border-bottom:2px solid var(--navy); }
  .box.b2{ background:var(--pink); animation-delay:2s; }
  .box.b3{ background:#B7E3FF; animation-delay:4s; }
  @keyframes conveyor{
    0%{ left:-60px; transform:rotate(0deg); }
    45%{ transform:rotate(0deg); }
    50%{ transform:translateY(-6px) rotate(-8deg); }
    55%{ transform:rotate(0deg); }
    100%{ left:104%; transform:rotate(0deg);}
  }

  .mascot{
    position:absolute; bottom:100px; left:50%; margin-left:-38px; width:76px;
    animation:mascotBounce 0.9s ease-in-out infinite;
  }
  @keyframes mascotBounce{ 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-14px) rotate(2deg); } }
  .mascot svg{ width:100%; height:auto; display:block; }
  .arm-left{ transform-origin:60px 70px; animation:waveLeft 0.9s ease-in-out infinite; }
  .arm-right{ transform-origin:110px 70px; animation:waveRight 0.9s ease-in-out infinite; }
  @keyframes waveLeft{ 0%,100%{transform:rotate(-6deg);} 50%{transform:rotate(10deg);} }
  @keyframes waveRight{ 0%,100%{transform:rotate(6deg);} 50%{transform:rotate(-10deg);} }
  .eye{ animation:blink 3.4s ease-in-out infinite; transform-origin:center; }
  @keyframes blink{ 0%,92%,100%{transform:scaleY(1);} 95%{transform:scaleY(0.1);} }

  .truck-wrap{ position:absolute; bottom:88px; left:-260px; animation:driveBy 9s linear infinite; }
  @keyframes driveBy{ 0%{ left:-260px; } 100%{ left:110%; } }
  .truck-wrap svg{ width:170px; height:auto; display:block; }
  .wheel{ animation:spin 0.5s linear infinite; transform-origin:center; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .puff{
    position:absolute; bottom:6px; right:160px; width:10px; height:10px;
    background:#ffffffcc; border-radius:50%;
    animation:puffOut 1.1s ease-out infinite;
  }
  @keyframes puffOut{ 0%{ transform:translate(0,0) scale(0.4); opacity:0.9;} 100%{ transform:translate(20px,-18px) scale(1.6); opacity:0;} }

  .tag{
    position:absolute; top:10%;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13px;
    background:white; border:2px solid var(--navy); border-radius:8px; padding:6px 10px;
    animation:drift 5s ease-in-out infinite;
    box-shadow:2px 2px 0 var(--navy);
  }
  @keyframes drift{ 0%,100%{ transform:translateY(0) rotate(-4deg); } 50%{ transform:translateY(-18px) rotate(4deg); } }

  footer{ text-align:center; font-size:12px; color:#a6a3c0; padding:18px 0 30px; position:relative; z-index:5; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
  }

  @media (max-width:640px){
    .topbar{ padding:20px 22px; }
    .scene{ height:280px; }
  }
</style>
</head>
<body>

  <div id="sparkles"></div>

  <div class="topbar">
    <div class="logo"><div class="logo-badge">🛍️</div>ZENO</div>
    <div class="status-pill"><span class="dot"></span> Building the store</div>
  </div>

  <div class="hero">
    <div class="eyebrow">Coming soon</div>
    <h1>We're taping up the<br> last <span class="accent">boxes</span></h1>
    <p class="sub">Our shelves are almost stocked.</p>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill"></div></div>
      <div class="progress-label">STORE SETUP · 0% PACKED</div>
    </div>
  <div class="scene">
    <div class="tag" style="left:8%; top:6%; animation-delay:0s;">-20% 🏷️</div>
    <div class="tag" style="left:80%; top:16%; animation-delay:1.2s;">NEW ✨</div>
    <div class="tag" style="left:46%; top:2%; animation-delay:2.1s;">SALE 🎉</div>

    <div class="mascot">
      <svg viewBox="0 0 170 150" fill="none">
        <rect x="40" y="55" width="90" height="80" rx="18" fill="#FF6B5B" stroke="#2B2A4C" stroke-width="4"/>
        <path d="M60 55 C60 30, 110 30, 110 55" stroke="#2B2A4C" stroke-width="6" fill="none" stroke-linecap="round"/>
        <rect x="40" y="55" width="90" height="14" fill="#E9503F" stroke="#2B2A4C" stroke-width="4"/>
        <line class="arm-left" x1="42" y1="90" x2="18" y2="72" stroke="#2B2A4C" stroke-width="6" stroke-linecap="round"/>
        <line class="arm-right" x1="128" y1="90" x2="152" y2="72" stroke="#2B2A4C" stroke-width="6" stroke-linecap="round"/>
        <ellipse cx="65" cy="140" rx="12" ry="7" fill="#2B2A4C"/>
        <ellipse cx="105" cy="140" rx="12" ry="7" fill="#2B2A4C"/>
        <ellipse class="eye" cx="70" cy="95" rx="6" ry="8" fill="#2B2A4C"/>
        <ellipse class="eye" cx="100" cy="95" rx="6" ry="8" fill="#2B2A4C"/>
        <circle cx="58" cy="108" r="7" fill="#FF9EC0" opacity="0.7"/>
        <circle cx="112" cy="108" r="7" fill="#FF9EC0" opacity="0.7"/>
        <path d="M75 112 Q85 120, 95 112" stroke="#2B2A4C" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="belt"></div>
    <div class="box" style="left:-60px;"></div>
    <div class="box b2" style="left:-60px;"></div>
    <div class="box b3" style="left:-60px;"></div>

    <div class="truck-wrap">
      <div class="puff"></div>
      <svg viewBox="0 0 170 100" fill="none">
        <rect x="4" y="35" width="90" height="45" rx="6" fill="#FFC24B" stroke="#2B2A4C" stroke-width="4"/>
        <line x1="20" y1="35" x2="20" y2="80" stroke="#2B2A4C" stroke-width="3"/>
        <line x1="45" y1="35" x2="45" y2="80" stroke="#2B2A4C" stroke-width="3"/>
        <path d="M94 50 H140 L156 66 V80 H94 Z" fill="#B7E3FF" stroke="#2B2A4C" stroke-width="4"/>
        <rect x="110" y="58" width="20" height="14" rx="2" fill="#FFF6EC" stroke="#2B2A4C" stroke-width="3"/>
        <circle class="wheel" cx="40" cy="84" r="14" fill="#2B2A4C"/>
        <circle cx="40" cy="84" r="5" fill="#FFF6EC"/>
        <circle class="wheel" cx="128" cy="84" r="14" fill="#2B2A4C"/>
        <circle cx="128" cy="84" r="5" fill="#FFF6EC"/>
      </svg>
    </div>

    <div class="ground"></div>
  </div>

  <footer>© 2026 Kartly — something good is on the way</footer>

<script>
  const container = document.getElementById('sparkles');
  const icons = ['✨','🎁','🛒','⭐','🎀'];
  for(let i=0;i<16;i++){
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = icons[Math.floor(Math.random()*icons.length)];
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = 100 + Math.random()*20 + 'vh';
    s.style.animationDuration = (7 + Math.random()*6) + 's';
    s.style.animationDelay = (Math.random()*8) + 's';
    s.style.fontSize = (12 + Math.random()*10) + 'px';
    container.appendChild(s);
  }

  const label = document.querySelector('.progress-label');
  const target = 78;
  const start = performance.now();
  function tick(now){
    const t = Math.min(1, (now - start) / 3200);
    const pct = Math.round(target * (1 - Math.pow(1-t,3)));
    label.textContent = `STORE SETUP · ${pct}% PACKED`;
    if(t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>

</body>
</html>
